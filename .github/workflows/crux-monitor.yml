name: CrUX Performance Monitor

on:
  schedule:
    # 매주 월요일 09:00 KST (일요일 00:00 UTC) 실행
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crux-check:
    name: Check Chrome UX Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CrUX Report Checker
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          node scripts/fetch-crux.mjs https://woohannah.com || true
